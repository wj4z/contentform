name: build-dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          clang -dynamiclib ContentForm.m -o ContentForm.dylib \
            -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework UIKit -framework Foundation -framework UserNotifications \
            -miphoneos-version-min=13.0
          codesign -f -s - ContentForm.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: ContentForm
          path: ContentForm.dylib
